; ME74 Prototype 2 DRONE LOGGER firmware (XIAO ESP32-S3)
;
; One environment per drone:   drone1 -> Typhoon G payload   drone2 -> Contixo F28 payload
; In VS Code: PlatformIO sidebar > Project Tasks > drone1 (or drone2) > Upload
; From a terminal:  pio run -e drone1 -t upload
; Plug in one board at a time so the upload goes to the right one.
;
; This is a separate project from ME74_combined (which is unchanged).

[platformio]
default_envs = drone1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Bigger storage for the logs: ~5.9 MB of the 8 MB flash (about 15 minutes of flying)
board_build.partitions = partitions_logs.csv
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit GPS Library
    https://github.com/mcauser/RadioHead.git#27d3392f7bc38c5711484bc19681addf91370aa4
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

[env:drone1]
build_flags = -D DRONE_NUM=1

[env:drone2]
build_flags = -D DRONE_NUM=2
