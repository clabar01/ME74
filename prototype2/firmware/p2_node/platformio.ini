; ME74 Prototype 2 NODE BEACON firmware (XIAO ESP32-S3 + RFM95)
;
; One environment per stationary node:  node1 -> node A   node2 -> node B   node3 -> node C
; In VS Code: PlatformIO sidebar > Project Tasks > node1 (or node2...) > Upload
; From a terminal:  pio run -e node1 -t upload
;
; This is a separate project from ME74_combined (which is unchanged).

[platformio]
default_envs = node1

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/mcauser/RadioHead.git#27d3392f7bc38c5711484bc19681addf91370aa4
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

[env:node1]
build_flags = -D NODE_NUM=1

[env:node2]
build_flags = -D NODE_NUM=2

[env:node3]
build_flags = -D NODE_NUM=3
