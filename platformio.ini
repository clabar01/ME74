; PlatformIO project settings for the ME74 IMU sketch
; Build/upload with the PlatformIO toolbar in VS Code (checkmark = build, arrow = upload).
;
; Two versions can be built:
;   xiao_esp32s3  = current sketch (IMU_initialtest.cpp)       <- default
;   old_firmware  = original sketch, for before/after testing (old_firmware/IMU_old.cpp)
;   radio_node1   = LoRa transceiver (transceiver.ino) as node 1
;   radio_node2   = LoRa transceiver (transceiver.ino) as node 2
; From a terminal:  pio run -e old_firmware -t upload

[platformio]
; Keep the .ino in the project root instead of a src/ folder
src_dir = .
default_envs = xiao_esp32s3

; Settings shared by both versions
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Libraries are downloaded automatically into .pio/libdeps/
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

[env:xiao_esp32s3]
; Only compile the sketch itself
build_src_filter = +<IMU_initialtest.cpp>

[env:old_firmware]
build_src_filter = +<old_firmware/IMU_old.cpp>

; LoRa transceiver: flash one board with each env
[env:radio_node1]
build_src_filter = +<transceiver.ino.cpp>
build_flags = -D NODE_ID=1
lib_deps = mikem/RadioHead
; Wildcard so it never picks a Bluetooth port
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

[env:radio_node2]
build_src_filter = +<transceiver.ino.cpp>
build_flags = -D NODE_ID=2
lib_deps = mikem/RadioHead
; Wildcard so it never picks a Bluetooth port
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
