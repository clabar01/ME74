; ME74 combined firmware: LoRa radio + ESP-NOW + IMU + GPS on one XIAO ESP32-S3
;
; Flash the SAME code on both boards, one environment each:
;   node1 -> first board      node2 -> second board
; In VS Code: PlatformIO sidebar > Project Tasks > node1 (or node2) > Upload
; From a terminal:  pio run -e node1 -t upload
; Plug in one board at a time so the upload goes to the right one.

[platformio]
default_envs = node1

[env]
; pioarduino = Arduino-ESP32 core 3.x (needed for the ESP-NOW signal strength)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ICM20X
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit GPS Library
    ; RadioHead 1.143 (Mike McCauley's library, GitHub mirror). Older RadioHead
    ; versions don't compile on Arduino-ESP32 core 3.x.
    https://github.com/mcauser/RadioHead.git#27d3392f7bc38c5711484bc19681addf91370aa4
; Wildcard so it never picks a Bluetooth port (macOS)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

[env:node1]
build_flags = -D NODE_ID=1

[env:node2]
build_flags = -D NODE_ID=2
